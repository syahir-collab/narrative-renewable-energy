<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Friendly Future – Narrative Text</title>
<style>
:root{--ink:#12324a;--sky:#e3f4fb;--leaf:#2f8f5b;--sun:#f5b82e;--paper:#fbfdfc;--blue:#2b7bb9;--gold:#9a6b00;--plum:#7a5aa6;--line:#c9dde6}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bar{position:sticky;top:0;height:8px;background:#fff}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .4s}
main{max-width:760px;margin:0 auto;padding:16px 16px 140px}
.count{font-size:14px;color:#42667d;margin:4px 0 8px}
h1{font:700 30px/1.2 Georgia,"Times New Roman",serif;margin:.2em 0}
h2{font:700 24px/1.25 Georgia,serif;margin:.2em 0 .5em}
h3{margin:.8em 0 .2em;font-size:18px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}
.fig{border-radius:14px;overflow:hidden;background:linear-gradient(#bfe6f6,#eaf8ff);margin:8px 0}
.fig svg,.fig img{display:block;width:100%;height:auto}
.cover{margin-top:0;border:2px solid var(--line)}
.cap{font-size:13px;color:#55778c;padding:6px 10px;background:#fff}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;margin:4px 0 12px}
input:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
label{font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700}
.btn:disabled{background:#a9bcc6;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px 10px;box-shadow:0 -4px 14px rgba(18,50,74,.12)}
#dots{width:100%;display:flex;gap:8px;justify-content:center}
#dots button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
#dots button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#dots button:disabled{opacity:.4;cursor:not-allowed}
nav .btn{padding:10px 18px}
nav .btn.alt:disabled{background:#eef3f6;color:#8aa0ad}
.err{color:#b3261e;font-size:14px;min-height:20px}
.tip{background:#fff7dc;border-left:6px solid var(--sun);padding:10px 14px;border-radius:8px;margin:12px 0}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.types div{background:var(--sky);border-radius:10px;padding:8px 12px;font-size:15px}
.st{display:block;width:100%;text-align:left;border:2px solid;border-radius:14px;padding:12px 16px;margin:8px 0;background:#fff;color:var(--ink)}
.st b{font-size:18px}.st .d{display:none;margin-top:6px;font-size:15px}.st.open .d{display:block}
.c-o{border-color:var(--leaf)}.c-c{border-color:var(--blue)}.c-r{border-color:var(--gold)}.c-e{border-color:var(--plum)}
.k{background:#fff2bf;border-radius:4px;padding:0 3px;font-weight:600}
.q{margin:14px 0}.q button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:#fff}
.q button.ok{background:#d8f3e3;border-color:var(--leaf)}.q button.no{background:#fde2df;border-color:#d9534f}
.fb{font-size:14px;min-height:20px;margin-top:4px}
.story p{font:18px/1.75 Georgia,serif;margin:10px 0;padding:10px 14px;border-left:6px solid;border-radius:0 10px 10px 0;background:#fff}
.story .tag{display:block;font:700 13px system-ui,sans-serif;margin-bottom:2px}
.story .o{border-color:var(--leaf)}.story .o .tag{color:var(--leaf)}
.story .c{border-color:var(--blue)}.story .c .tag{color:var(--blue)}
.story .r{border-color:var(--gold)}.story .r .tag{color:var(--gold)}
.story .e{border-color:var(--plum)}.story .e .tag{color:var(--plum)}
.w{border-bottom:2px dotted var(--blue);cursor:help}
#gloss{position:sticky;top:12px;z-index:5;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;margin:6px 0}
details{margin:8px 0;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 14px}
summary{cursor:pointer;font-weight:600}
ul.ref{padding-left:20px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const pages=[
()=>`<div class="fig cover"><img src="${COVER}" alt="Sampul: Narrative Text Science Fiction – The Friendly Future: Renewable Energy"></div>
<div class="card"><label for="n">Nama</label><input id="n" autocomplete="name" value="${S.name}"><label for="k">Kelas</label><input id="k" value="${S.kelas}" placeholder="contoh: XI IPA 1"><label for="s">Asal sekolah</label><input id="s" value="${S.sekolah}"><div class="err" id="err"></div><button class="btn" id="go">Start learning</button></div>`,
()=>`<div class="count">Hello, ${S.name}!</div><h2>What is Narrative Text?</h2>${fig(svgBook,"A story can carry an idea, like a book that grows a leaf")}
<div class="card"><p><b>Narrative text</b> is a text that tells a story about people, animals or things in a series of events. Its <b>social function</b> is to entertain readers or listeners and, often, to give a moral message.</p>
<h3>Kinds of narrative text</h3><div class="types"><div><b>Fable</b> – animals act like humans</div><div><b>Legend</b> – origin of a place</div><div><b>Fairy tale</b> – magic and kingdoms</div><div><b>Myth</b> – gods and nature</div><div><b>Science fiction</b> – future technology</div><div><b>Adventure</b> – journeys and risks</div></div>
<div class="tip"><b>Did you know?</b> A story set in the future, such as a village that switches to clean power, is science fiction: it imagines how energy from the sun, wind and water can change daily life.</div></div>`,
()=>`<h2>Generic Structure</h2>${fig(svgFlow,"The story arc: the problem rises, then is solved")}
<p>Tap each card to read more.</p>
<button class="st c-o"><b>Orientation</b><div class="d">Introduces the characters, time and place. <span class="k">Once upon a time, in a small village called Sinar Desa, lived a girl named Maya.</span></div></button>
<button class="st c-c"><b>Complication</b><div class="d">The problem that the main character faces. <span class="k">The old generator stopped and the whole village was dark.</span></div></button>
<button class="st c-r"><b>Resolution</b><div class="d">How the problem is solved (happy or sad ending). <span class="k">The villagers installed solar panels and a wind turbine.</span></div></button>
<button class="st c-e"><b>Evaluation &amp; Reorientation (optional)</b><div class="d">Evaluation: the writer's comments on the events. Reorientation: a closing statement or moral. <span class="k">Maya learned that a small idea can change the world.</span></div></button>`,
()=>`<h2>Language Features</h2>${fig(svgPanel,"Solar, wind and water: the heroes of many future stories")}
<div class="card"><h3>1. Simple past tense</h3><p>Events already finished: <span class="k">Maya asked</span> her teacher for help. Irregular verbs: build → <span class="k">built</span>, go → <span class="k">went</span>, come → <span class="k">came</span>.</p>
<h3>2. Time connectives</h3><p><span class="k">one day</span>, <span class="k">suddenly</span>, <span class="k">then</span>, <span class="k">after that</span>, <span class="k">finally</span>, <span class="k">years later</span>.</p>
<h3>3. Action verbs &amp; adjectives</h3><p>The turbine <span class="k">spun</span>; the lights came on, <span class="k">clean</span> and <span class="k">quiet</span>.</p>
<h3>4. Direct speech</h3><p><span class="k">“We cannot live like this,”</span> Maya said sadly.</p></div>
<h3>Quick practice</h3>${quiz(QZ)}`,
()=>`<div class="count">Read the model text, ${S.name}</div><h2>Model Text: “The Friendly Future”</h2><div id="gloss">Tap a dotted word to see its meaning.</div>
<div class="story">
<p class="o"><span class="tag">ORIENTATION</span>Long ago, in a small village called Sinar Desa, lived a girl named Maya. Every evening the village went dark because the old <span class="w" data-m="diesel generator = mesin pembangkit listrik solar">diesel generator</span> was noisy, expensive and often <span class="w" data-m="broke down = rusak">broke down</span>.</p>
<p class="c"><span class="tag">COMPLICATION</span>One night, the generator stopped just as Maya's little brother was doing his homework. Thick smoke filled the air and the villagers began to cough. “We cannot live like this,” Maya said sadly.</p>
<p class="r"><span class="tag">RESOLUTION</span>The next morning, Maya asked her teacher for help. Together with the villagers, they put <span class="w" data-m="solar panels = panel surya">solar panels</span> on the roofs, built a small <span class="w" data-m="wind turbine = turbin angin">wind turbine</span> on the hill and turned cow manure into <span class="w" data-m="biogas = gas hayati dari kotoran/limbah organik">biogas</span>. Slowly, the lights came on, clean and quiet.</p>
<p class="e"><span class="tag">REORIENTATION</span>Years later, Sinar Desa became known as the friendly village of the future. Maya learned that a small idea, shared with others, can change the world.</p></div>
<div class="tip"><b>Moral value:</b> Small actions and cooperation can bring clean energy and a better future.</div>
<h3>Check your understanding</h3>
<details><summary>1. What was the problem in Sinar Desa?</summary>The old diesel generator was noisy, costly and broke down, so the village was dark and smoky.</details>
<details><summary>2. How did the villagers solve it?</summary>They used solar panels, a wind turbine and biogas.</details>
<details><summary>3. Which sentence shows direct speech?</summary>“We cannot live like this,” Maya said sadly.</details>`,
()=>`<h1>Well done, ${S.name}!</h1><p>${S.kelas} · ${S.sekolah}</p>${fig(svgScene,"The friendly future starts with a good story")}
<div class="card"><p>You have learned the purpose, generic structure and language features of narrative text. Next, write your own story about a friendly future powered by renewable energy.</p><button class="btn alt" id="again">Back to start</button>
<h3>References</h3><ul class="ref"><li>Kemendikbudristek RI. Buku teks Bahasa Inggris SMA/SMK kelas XI, Kurikulum Merdeka, dan Capaian Pembelajaran Bahasa Inggris Fase F.</li><li>Gerot, L. &amp; Wignell, P. (1994). <i>Making Sense of Functional Grammar</i>. Antipodean Educational Enterprises.</li><li>Azar, B. S. <i>Understanding and Using English Grammar</i>. Pearson.</li><li>Cambridge Dictionary; Oxford Learner's Dictionaries (definisi dan makna kata).</li><li>IEA, IRENA dan Kementerian ESDM RI (informasi umum energi terbarukan).</li></ul>
<p style="font-size:13px">Cerita “The Friendly Future” dan ilustrasi di dalam materi adalah karya orisinal untuk media pembelajaran ini; gambar sampul dari pengembang.</p></div>`
];

function render(){
  document.getElementById("app").innerHTML=(p>0&&p<5?`<div class="count">Page ${p+1} / 6</div>`:"")+pages[p]();
  document.getElementById("fill").style.width=(p/(pages.length-1)*100)+"%";
  updateNav();
  window.scrollTo(0,0);
  if(p===0){const go=document.getElementById("go");go.onclick=()=>{const n=v("n"),k=v("k"),s=v("s");if(!n||!k||!s){document.getElementById("err").textContent="Isi nama, kelas dan asal sekolah dulu ya.";return}S.name=n;S.kelas=k;S.sekolah=s;p=1;render()}}
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
  document.querySelectorAll(".q button").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,o=+b.dataset.o,q=QZ[i],fb=document.getElementById("fb"+i);
    if(o===q.a){b.className="ok";fb.textContent="Correct! "+q.e}else{b.className="no";fb.textContent="Try again!"}});
  document.querySelectorAll(".w").forEach(w=>w.onclick=()=>document.getElementById("gloss").textContent=w.dataset.m);
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>{p=0;render()};
}
const v=id=>document.getElementById(id).value.trim();
function updateNav(){
  const ok=!!S.name,d=document.getElementById("dots");
  d.innerHTML=pages.map((_,i)=>`<button data-p="${i}" aria-label="Halaman ${i+1}" ${i===p?'aria-current="page" class="on"':""} ${i&&!ok?"disabled":""}>${i+1}</button>`).join("");
  d.querySelectorAll("button").forEach(b=>b.onclick=()=>{p=+b.dataset.p;render()});
  document.getElementById("home").disabled=p===0;
  document.getElementById("back").disabled=p===0;
  document.getElementById("next").disabled=p===pages.length-1||!ok;
}
document.getElementById("home").onclick=()=>{p=0;render()};
document.getElementById("next").onclick=()=>{if(p<pages.length-1){p++;render()}};
document.getElementById("back").onclick=()=>{if(p>0){p--;render()}};
render();
</script>
